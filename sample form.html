<form action="mailto:rangelamoradi19@gmail.com" method="post" enctype="text/plain" style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9; font-family: Arial, sans-serif;">
    
    <h2 style="text-align: center; font-weight: bold; margin-bottom: 20px;">فرم نمونه</h2>

    <label style="font-weight: bold; display: block; margin-bottom: 5px;">نام:</label>
    <input type="text" name="name" value="مسعوده" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label style="font-weight: bold; display: block; margin-bottom: 5px;">ایمیل:</label>
    <input type="email" name="email" value="rangelamoradi19@gmail.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label style="font-weight: bold; display: block; margin-bottom: 5px;">علایق:</label>
    <select name="interest" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">انتخاب کنید</option>
        <option value="computer" selected>برنامه‌های کامپیوتری</option>
        <option value="web">طراحی وب</option>
        <option value="graphic">گرافیک</option>
        <option value="music">موسیقی</option>
    </select>

    <label style="font-weight: bold; display: block; margin-bottom: 5px;">پیام:</label>
    <textarea name="message" rows="4" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
سلام، من مسعوده هستم و علاقمند به برنامه‌های کامپیوتری هستم. لطفاً اطلاعات بیشتر را برایم ارسال کنید.
    </textarea>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;">ارسال</button>
</form>
